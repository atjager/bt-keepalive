name: Build Windows EXEs

on:
  push:
    branches: [ "main" ]
    paths:
      - "bt_keepalive.py"
      - "installer.py"
      - "uninstall.py"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Download NSSM
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nssm.cc/release/nssm-2.24.zip" -OutFile "nssm.zip"
          Expand-Archive -Path "nssm.zip" -DestinationPath "nssm_extracted"
          Copy-Item "nssm_extracted\nssm-2.24\win64\nssm.exe" -Destination "nssm.exe"

      - name: Build background worker EXE
        run: pyinstaller --onefile --noconsole --name bt_keepalive bt_keepalive.py

      - name: Build installer EXE (bundles worker + nssm)
        run: pyinstaller --onefile --name bt_keepalive_installer --add-binary "dist\bt_keepalive.exe;." --add-binary "nssm.exe;." installer.py

      - name: Build uninstaller EXE
        run: pyinstaller --onefile --name bt_keepalive_uninstall uninstall.py

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt_keepalive_installer
          path: dist/bt_keepalive_installer.exe
          retention-days: 30

      - name: Upload uninstaller artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt_keepalive_uninstall
          path: dist/bt_keepalive_uninstall.exe
          retention-days: 30
